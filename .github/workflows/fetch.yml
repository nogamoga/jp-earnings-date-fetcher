name: Fetch JPX earnings JSON

on:
  schedule:
    - cron: "0 1 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: python -m jpx_earnings fetch --out docs/v1
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/v1/events.json docs/v1/manifest.json
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "Update earnings events from JPX"
          git push
